services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trademarket}
      POSTGRES_USER: ${POSTGRES_USER:-trademarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@trademaeket.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./database/002_wallet_ledger.sql:/docker-entrypoint-initdb.d/002-wallet-ledger.sql:ro
      - ./database/003_deposit_proof.sql:/docker-entrypoint-initdb.d/003-deposit-proof.sql:ro
      - ./database/004_admin_account_management.sql:/docker-entrypoint-initdb.d/004-admin-account-management.sql:ro
      - ./database/005_withdrawal_reasons.sql:/docker-entrypoint-initdb.d/005-withdrawal-reasons.sql:ro
      - ./database/006_reward_cooldown.sql:/docker-entrypoint-initdb.d/006-reward-cooldown.sql:ro
      - ./database/007_seed_initial_admin.sh:/docker-entrypoint-initdb.d/007-seed-initial-admin.sh:ro
      - ./database/008_withdrawal_profiles_and_limits.sql:/docker-entrypoint-initdb.d/008-withdrawal-profiles-and-limits.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-trademarket}
      DB_USER: ${POSTGRES_USER:-trademarket}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
